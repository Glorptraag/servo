name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The canvas's browser tests (packages/canvas/vitest.config.ts) run in Playwright's Chromium; the list view's tap
      # and click tests run in its WebKit as well, Safari's engine.
      - run: pnpm --filter @servo/canvas exec playwright install --with-deps chromium webkit
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm -r test
      - run: pnpm validate-content packages/content --terminology packages/content/terminology
      # Golden runs (task 1.7): each fixture's expect, and each Run against packages/sim-core/golden/. About 10 s.
      - run: pnpm golden

  e2e:
    # The canvas e2e harness (packages/tools/src/e2e/README.md) in five shards that run side by side, each within the
    # ten-minute budget: the screenshots, their mutation test and the gestures; Run mode's recorded fixture
    # Runs (task 3.5), which take about five minutes on a software GPU and so have their own; and the parity check's
    # three fixture groups. The e2e-report job prints one parity report from the shards' reports. Frame time is the perf
    # job's.
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: views
            files: test/e2e/screenshots.e2e.ts test/e2e/screenshot-mutations.e2e.ts test/e2e/gestures.e2e.ts
          - shard: run-animation
            files: test/e2e/run-animation.e2e.ts
          - shard: parity-1
            files: test/e2e/parity-1.e2e.ts
            strict: '1'
          - shard: parity-2
            files: test/e2e/parity-2.e2e.ts
            strict: '1'
          - shard: parity-3
            files: test/e2e/parity-3.e2e.ts
            strict: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium is cached by Playwright's version; the system libraries it needs are installed either way.
      - id: playwright
        run: echo "version=$(pnpm --filter @servo/tools exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @servo/tools exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @servo/tools exec playwright install-deps chromium
      # Runs pnpm art, then this shard's files. Parity is strict (gate G3): a fixture left partial or pending fails.
      - run: pnpm e2e ${{ matrix.files }}
        env:
          SERVO_PARITY_STRICT: ${{ matrix.strict || '0' }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report-${{ matrix.shard }}
          path: packages/tools/node_modules/e2e-report/
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshot-diffs-${{ matrix.shard }}
          path: packages/tools/node_modules/e2e-screenshots/
          if-no-files-found: warn

  perf:
    # Every timing budget, apart from the correctness jobs so that a slow runner reads as a perf result on its own:
    # sim-core's per-tick cost, the canvas's frame time, and the e2e harness's and Run mode's frame time (pnpm perf).
    # Each frame-time test takes five samples, prints every one, and holds the median sample to the 16 ms budget.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One Playwright for canvas and tools; Chromium cached by its version, as in the e2e job.
      - id: playwright
        run: echo "version=$(pnpm --filter @servo/tools exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @servo/tools exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @servo/tools exec playwright install-deps chromium
      - run: pnpm perf

  e2e-report:
    # One per-fixture parity report, merged from the parity shards' reports.
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-report-*
          path: e2e-reports
      - run: node packages/tools/src/e2e/merge-report.ts e2e-reports
