name: Release

# A v* tag makes a tester release (packages/tools/src/release/README.md): the web build with the app and content
# versions baked in, the separately versioned content bundle and, when the SERVO_INVITE_SEED secret is set, the tester
# invite codes, uploaded as workflow artifacts. No host has been chosen (D10, D13): the deploy step runs only once a
# DEPLOY_TOKEN secret exists, and the summary says when it was skipped. CI (ci.yml) checks the same push.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # An `if` cannot read secrets, so the job passes on only whether each is set. The values go to the steps that use them.
      HAS_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Checks the content, runs pnpm build (which runs pnpm art first) with the versions and the code hashes baked in,
      # and writes dist/release: web/, content/servo-content.json, release.json and private/invite-codes.txt. It writes
      # the step summary, and the outputs the uploads are named by.
      - name: Build the release
        id: release
        env:
          SERVO_INVITE_SEED: ${{ secrets.SERVO_INVITE_SEED }}
          INVITE_COUNT: ${{ vars.SERVO_INVITE_COUNT || '10' }}
        run: node packages/tools/src/release/main.ts --tag "$GITHUB_REF_NAME" --invite-count "$INVITE_COUNT"
      - name: Upload the web build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servo-web-${{ steps.release.outputs.app-version }}
          path: |
            dist/release/web
            dist/release/release.json
          if-no-files-found: error
          overwrite: true
      - name: Upload the content bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servo-content-${{ steps.release.outputs.content-version }}
          path: dist/release/content
          if-no-files-found: error
          overwrite: true
      # The code list goes only here, never into the repository or the web build. Everyone with read access to the
      # repository can download it, so it is kept for a week; re-running the release makes the same codes again.
      - name: Upload the invite codes (private)
        if: steps.release.outputs.invite-codes != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: servo-invite-codes-${{ steps.release.outputs.app-version }}
          path: dist/release/private
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # Once Drew picks a host, this step runs its deploy command with DEPLOY_TOKEN: a CLI pinned in the lockfile, or an
      # action pinned by commit SHA. Until then a token alone has nothing to run, so the release says so and fails.
      - name: Deploy
        if: env.HAS_DEPLOY_TOKEN == 'true'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "::error title=No deploy command::DEPLOY_TOKEN is set, but no host has been chosen yet (D10), so there is no deploy command to run. See packages/tools/src/release/README.md, Deploying."
          exit 1
      - name: Tester URL
        if: env.HAS_DEPLOY_TOKEN == 'true'
        env:
          TESTER_URL: ${{ vars.TESTER_URL }}
        run: |
          echo "Tester URL: ${TESTER_URL:?Set the TESTER_URL variable to the address the host serves the build at.}"
          printf '### Tester URL\n\n%s (Settings at %s/settings)\n' "$TESTER_URL" "${TESTER_URL%/}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy skipped
        if: env.HAS_DEPLOY_TOKEN != 'true'
        run: |
          {
            echo '### Deploy'
            echo ''
            echo 'Skipped: no `DEPLOY_TOKEN` secret is set, because no host has been chosen yet (D10, D13). Nothing was deployed, so there is no tester URL.'
            echo 'To try the build, serve the web artifact as packages/tools/src/release/README.md says, under "Serving a release without a host".'
          } >> "$GITHUB_STEP_SUMMARY"
