# Accepts e2e screenshot references from CI's own Chromium, the browser that compares them (ci.yml's e2e job).
# A reference drawn on a worker's machine can differ from CI's drawing of the same build by more than the pixel
# rule allows (packages/tools/src/e2e/pixels.ts), on the busiest fixtures by an anti-aliasing drift between Chromium
# builds. Run by hand only, for an intended change, with an orchestrator note, as `pnpm golden --accept` is: it runs
# `pnpm e2e -u` on the files given (and only the tests whose names match `name`, when given), then commits any
# reference under packages/tools/test/e2e/__screenshots__ that changed, to the branch it was run on. A commit this
# workflow pushes starts no CI run of its own (GitHub never runs workflows for a GITHUB_TOKEN push), so run CI on
# the branch afterwards (ci.yml, "Run workflow").
name: Accept screenshots

on:
  workflow_dispatch:
    inputs:
      files:
        description: The e2e files to run, relative to packages/tools (space-separated)
        default: test/e2e/screenshots.e2e.ts
        required: true
      name:
        description: Only the tests whose names match this (vitest -t), or every test in the files when empty
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: accept-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from packageManager
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium is cached by Playwright's version, as in ci.yml; the system libraries it needs are installed either way.
      - id: playwright
        run: echo "version=$(pnpm --filter @servo/tools exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @servo/tools exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @servo/tools exec playwright install-deps chromium
      # Runs pnpm art, then the files with vitest's -u, which writes each screenshot taken as its reference.
      - run: |
          if [ -n "$NAME" ]; then
            pnpm e2e -u $FILES -t "$NAME"
          else
            pnpm e2e -u $FILES
          fi
        env:
          FILES: ${{ inputs.files }}
          NAME: ${{ inputs.name }}
      - run: |
          git add packages/tools/test/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No reference changed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Accept e2e screenshot references from CI's Chromium" \
            -m "Rewritten by the Accept screenshots workflow (files: $FILES; tests: ${NAME:-all})."
          git push origin "HEAD:$GITHUB_REF_NAME"
        env:
          FILES: ${{ inputs.files }}
          NAME: ${{ inputs.name }}
